<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CoolBreeze Dashboard</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #0d1117;
      --sidebar: #010409;
      --card: #161b22;
      --card-hover: #1c2128;
      --border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --green: #3fb950;
      --blue: #58a6ff;
      --purple: #bc8cff;
      --yellow: #d29922;
      --red: #f85149;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      width: 250px;
      min-height: 100vh;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 22px 16px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px 22px;
      border-bottom: 1px solid var(--border);
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
    }

    .brand-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }

    .brand-subtitle {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    .nav-section {
      margin-top: 24px;
    }

    .nav-label {
      color: #6e7681;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      padding: 0 10px;
      margin-bottom: 8px;
    }

    .dashboard-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dashboard-nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 7px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s ease;
    }

    .dashboard-nav a:hover {
      color: var(--text);
      background: #161b22;
    }

    .dashboard-nav a.active {
      color: var(--text);
      background: #21262d;
      border: 1px solid var(--border);
    }

    .nav-icon {
      width: 20px;
      text-align: center;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 14px 10px 4px;
      border-top: 1px solid var(--border);
    }

    .admin-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(63, 185, 80, 0.7);
    }

    /* ================= MAIN ================= */

    .main-content {
      margin-left: 250px;
      width: calc(100% - 250px);
      min-height: 100vh;
      padding: 28px;
    }

    .page-container {
      max-width: 1600px;
      margin: auto;
    }

    /* ================= GLOBAL CARDS ================= */

    .card {
      background: var(--card) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      color: var(--text);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .card-header {
      background: #161b22 !important;
      border-bottom: 1px solid var(--border) !important;
      color: var(--text);
    }

    .table {
      --bs-table-bg: transparent;
      --bs-table-color: var(--text);
      --bs-table-border-color: var(--border);
    }

    .table-light {
      --bs-table-bg: #161b22;
      --bs-table-color: var(--muted);
    }

    .table-hover > tbody > tr:hover > * {
      --bs-table-bg-state: #1c2128;
      color: var(--text);
    }

    .text-muted {
      color: var(--muted) !important;
    }

    /* ================= BUTTONS ================= */

    .btn-outline-secondary {
      color: var(--muted);
      border-color: var(--border);
    }

    .btn-outline-secondary:hover {
      background: #21262d;
      border-color: #8b949e;
      color: var(--text);
    }

    /* ================= SCROLLBAR ================= */

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }

    @media (max-width: 900px) {
      .sidebar {
        width: 210px;
      }

      .main-content {
        margin-left: 210px;
        width: calc(100% - 210px);
        padding: 18px;
      }
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .main-content {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">

      <div class="brand">
        <div class="brand-icon">❄</div>

        <div>
          <div class="brand-title">CoolBreeze AC</div>
          <div class="brand-subtitle">AI Support Console</div>
        </div>
      </div>

      <div class="nav-section">

        <div class="nav-label">
          Workspace
        </div>

        <nav class="dashboard-nav">

          <a href="{% url 'dashboard' %}" class="active">
            <span class="nav-icon">💬</span>
            <span>Conversations</span>
          </a>

        </nav>

      </div>

      <div class="sidebar-bottom">

        <div class="admin-status">
          <span class="status-dot"></span>
          <span>Logged in as admin</span>
        </div>

      </div>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

      <div class="page-container">

        {% block content %}

        {% endblock %}

      </div>

    </main>

  </div>

</body>
</html>
